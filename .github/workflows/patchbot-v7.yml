name: Patch Bot v7

on:
  push:
    paths:
      - '.github/workflows/patchbot-v7.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Bot
        shell: bash
        run: python3 .github/patch_bot_v7.py
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Bot.py
          git rm -f .github/workflows/patchbot-v7.yml .github/patch_bot_v7.py
          git rm -f .github/smoke-v6-result.txt || true
          git commit -m "Apply Bot v7 cleanup"
          git push
